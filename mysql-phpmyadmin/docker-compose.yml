services:
  phpmyadmin:
    container_name: phpmyadmin
    image: phpmyadmin:5
    restart: always
    ports:
      - 8081:80
  db:
    container_name: mysql
    image: mysql:8.4
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password123
    ports:
      - 3306:3306
    volumes:
      - db-vol:/var/lib/mysql

volumes:
  db-vol:
  